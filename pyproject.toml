[project]
name = "xassida-recognition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

dependencies = [
    "fastapi>=0.142.2",
    "librosa>=1.0.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "uvicorn>=0.54.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]
